name: Bug report
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Browser extension
        - Desktop widget
        - "<clawd-button> web component"
        - OBS overlay
        - Web playground
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Browser / OS
      placeholder: e.g. Chrome 140 on Windows 11
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Pick Guitar Jam\n2. Drag the widget to the top edge\n3. ..."
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, share code or settings
      description: A screenshot or a theme share code (Colors card) helps a lot.
